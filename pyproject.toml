[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2ui-accessibility-auditor"
version = "0.1.0"
description = "Audits declarative A2UI JSON component trees for WCAG contrast, ARIA labels, tab order, and interactive target safety"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
a2ui-accessibility-auditor = "a2ui_accessibility_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2ui_accessibility_auditor*"]
